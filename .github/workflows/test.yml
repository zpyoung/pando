name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.17.1

jobs:
  validate:
    name: Validate / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:run

      - name: Coverage
        if: matrix.node-version == '20.x'
        run: pnpm run test:coverage

      - name: Upload coverage artifact
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-20
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: macOS unit tests / Node 20
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate (format, lint, typecheck, unit tests)
        run: pnpm run validate

  build:
    name: Build and package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Generate oclif manifest
        run: pnpm exec oclif manifest

      - name: CLI smoke test
        run: |
          node ./bin/run.js --version
          node ./bin/run.js --help
          node ./bin/run.js list --json

      - name: Package contents smoke test
        run: |
          test -f oclif.manifest.json
          test -f dist/src/index.js
          test -x bin/run.js

  e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [validate, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run Docker E2E tests
        run: pnpm run test:e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'false'
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore
          retention-days: 7

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check GitHub Actions workflows
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o /tmp/actionlint.tgz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [validate, macos, build, e2e, workflow-lint]
    if: always()

    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.macos.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.build.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.workflow-lint.result }}" != "success" ]; then exit 1; fi
          echo "All CI jobs passed."
