name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  PNPM_VERSION: 10.17.1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:run

  build-tarballs:
    name: Build Tarballs
    runs-on: ubuntu-latest
    needs: test
    outputs:
      sha256_darwin_x64: ${{ steps.checksums.outputs.darwin_x64 }}
      sha256_darwin_arm64: ${{ steps.checksums.outputs.darwin_arm64 }}
      sha256_linux_x64: ${{ steps.checksums.outputs.linux_x64 }}
      sha256_linux_arm64: ${{ steps.checksums.outputs.linux_arm64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build tarballs
        run: pnpm pack:tarballs

      - name: Calculate checksums
        id: checksums
        run: |
          cd dist
          {
            echo "darwin_x64=$(shasum -a 256 ./*darwin-x64*.tar.gz | cut -d' ' -f1)"
            echo "darwin_arm64=$(shasum -a 256 ./*darwin-arm64*.tar.gz | cut -d' ' -f1)"
            echo "linux_x64=$(shasum -a 256 ./*linux-x64*.tar.gz | cut -d' ' -f1)"
            echo "linux_arm64=$(shasum -a 256 ./*linux-arm64*.tar.gz | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload tarballs to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz

  update-formula:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: [test, build-tarballs]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update formula
        env:
          VERSION_REF: ${{ github.ref_name }}
          SHA_DARWIN_X64: ${{ needs.build-tarballs.outputs.sha256_darwin_x64 }}
          SHA_DARWIN_ARM64: ${{ needs.build-tarballs.outputs.sha256_darwin_arm64 }}
          SHA_LINUX_X64: ${{ needs.build-tarballs.outputs.sha256_linux_x64 }}
          SHA_LINUX_ARM64: ${{ needs.build-tarballs.outputs.sha256_linux_arm64 }}
        run: |
          set -euo pipefail
          export VERSION="${VERSION_REF#v}"
          : "${VERSION:?VERSION is empty (derived from github.ref_name)}"
          : "${SHA_DARWIN_X64:?SHA_DARWIN_X64 is empty (missing build-tarballs output)}"
          : "${SHA_DARWIN_ARM64:?SHA_DARWIN_ARM64 is empty (missing build-tarballs output)}"
          : "${SHA_LINUX_X64:?SHA_LINUX_X64 is empty (missing build-tarballs output)}"
          : "${SHA_LINUX_ARM64:?SHA_LINUX_ARM64 is empty (missing build-tarballs output)}"
          envsubst \
            "\${VERSION} \${SHA_DARWIN_X64} \${SHA_DARWIN_ARM64} \${SHA_LINUX_X64} \${SHA_LINUX_ARM64}" \
            < Formula/pando.rb.template \
            > Formula/pando.rb

      - name: Commit updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/pando.rb
          git commit -m "chore(formula): update to ${GITHUB_REF_NAME}"
          git push

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [test, build-tarballs]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Generate oclif manifest
        run: pnpm exec oclif manifest

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke-published:
    name: Smoke test published package
    runs-on: ubuntu-latest
    needs: publish-npm
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for npm propagation
        env:
          VERSION_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_REF#v}"
          PKG="$(node -p "require('./package.json').name")"
          echo "Waiting for ${PKG}@${VERSION} to appear on npm..."
          for i in $(seq 1 60); do
            if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
              echo "Found ${PKG}@${VERSION} on npm."
              exit 0
            fi
            echo "Attempt ${i}: not available yet, retrying in 10s..."
            sleep 10
          done
          echo "Timed out waiting for ${PKG}@${VERSION} on npm."
          exit 1

      - name: Run published E2E tests
        env:
          # Pin the smoke test to the exact version just published (from the tag),
          # not whatever `latest` currently resolves to. The container helper
          # passes this through to the Docker build as the PANDO_VERSION build arg.
          VERSION_REF: ${{ github.ref_name }}
          TESTCONTAINERS_RYUK_DISABLED: 'false'
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          set -euo pipefail
          export PANDO_VERSION="${VERSION_REF#v}"
          echo "Smoke-testing published @zyoung-ff/pando@${PANDO_VERSION}"
          pnpm run test:e2e:published
